name: Backup do Banco Neon

on:
  schedule:
    # Toda semana, domingo às 03:00 UTC (~ meia-noite em Mato Grosso do Sul)
    - cron: '0 3 * * 0'
  workflow_dispatch: {}   # também permite rodar manualmente pelo botão "Run workflow"

permissions:
  contents: write

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositório
        uses: actions/checkout@v4

      - name: Instalar cliente PostgreSQL
        run: sudo apt-get update -y && sudo apt-get install -y postgresql-client

      - name: Preparar branch de backups (cria se ainda não existir)
        run: |
          git fetch origin backups || true
          if git show-ref --verify --quiet refs/remotes/origin/backups; then
            git checkout backups
          else
            git checkout --orphan backups
            git rm -rf . > /dev/null 2>&1 || true
          fi

      - name: Gerar dump do banco
        run: |
          mkdir -p backups
          pg_dump "${{ secrets.DATABASE_URL }}" --no-owner --no-privileges -F p \
            -f "backups/backup_$(date +%Y-%m-%d_%H%M).sql"

      - name: Enviar backup para o repositório
        run: |
          git config user.name "backup-bot"
          git config user.email "backup-bot@users.noreply.github.com"
          git add backups/*.sql
          git commit -m "Backup automático $(date +%Y-%m-%d %H:%M)" || echo "Nada novo para commitar"
          git push origin backups
