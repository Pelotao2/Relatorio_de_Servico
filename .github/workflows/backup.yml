name: Backup do Banco Neon

on:
  schedule:
    - cron: '0 3 * * 0'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositório
        uses: actions/checkout@v4

      - name: Instalar cliente PostgreSQL (versão compatível com o Neon)
        run: |
          sudo apt-get update -y
          sudo apt-get install -y wget gnupg lsb-release
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo wget --quiet -O /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          sudo sh -c 'echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          sudo apt-get update -y
          sudo apt-get install -y postgresql-client-18

      - name: Preparar branch de backups (cria se ainda não existir)
        run: |
          git fetch origin backups || true
          if git show-ref --verify --quiet refs/remotes/origin/backups; then
            git checkout backups
          else
            git checkout --orphan backups
            git rm -rf . > /dev/null 2>&1 || true
          fi

      - name: Gerar dump do banco
        run: |
          mkdir -p backups
          pg_dump "${{ secrets.DATABASE_URL }}" --no-owner --no-privileges -F p \
            -f "backups/backup_$(date +%Y-%m-%d_%H%M).sql"

      - name: Enviar backup para o repositório
        run: |
          git config user.name "backup-bot"
          git config user.email "backup-bot@users.noreply.github.com"
          git add backups/*.sql
          git commit -m "Backup automático $(date +%Y-%m-%d %H:%M)" || echo "Nada novo para commitar"
          git push origin backups
